# Canonical user-scoped development tools for Linux workstations.
#
# Ubuntu owns the OS, kernel, drivers, desktop, services, shared libraries, and
# bootstrap prerequisites. mise owns the developer-facing runtimes and CLIs.
# Use `mise outdated` and `mise upgrade` to refresh this manifest.
#
# npm 11.16+ supports mise's package-specific lifecycle-script allowlist. Use
# it rather than aube because OpenCode needs its own postinstall script.

[settings.npm]
package_manager = "npm"

[tools]
# Languages and runtime package managers. Node remains on its LTS major line.
bun = "latest"
go = "latest"
node = "24"
python = "latest"
pnpm = "latest"
rust = "latest"
uv = "latest"

# General developer CLIs from upstream release artifacts.
bat = "latest"
btop = "latest"
cmake = "latest"
duf = "latest"
"aqua:ogham/dog" = "latest"
eza = "latest"
fd = "latest"
fzf = "latest"
gh = "latest"
glab = "latest"
git-lfs = "latest"
godot = "latest"
helm = "latest"
herdr = "latest"
jq = "latest"
k9s = "latest"
kubectl = "latest"
lazygit = "latest"
neovim = "latest"
pandoc = "latest"
rclone = "latest"
ripgrep = "latest"
terraform = "latest"
tmux = "latest"
yq = "latest"
zellij = "latest"
zoxide = "latest"

# CLIs installed through language-specific mise backends, never directly with
# cargo install, go install, npm install -g, or pipx install.
"cargo:tealdeer" = "latest"
# The legacy code.gitea.io path resolves a stale v1.3.3 tag. Tea's current
# module path is gitea.dev/tea; pin its newest upstream release (v0.14.2).
"go:gitea.dev/tea" = "0.14.2"
"npm:@anthropic-ai/claude-code" = { version = "latest", allow_builds = ["@anthropic-ai/claude-code"] }
"npm:@earendil-works/pi-coding-agent" = "latest"
"npm:@google/gemini-cli" = "latest"
"npm:@openai/codex" = "latest"
"npm:opencode-ai" = { version = "latest", allow_builds = ["opencode-ai"] }
"npm:renovate" = "latest"
"pipx:glances" = "latest"
"pipx:httpie" = "latest"
"pipx:ranger-fm" = "latest"
